<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.logo{width:300px;height:300px;border-radius:66px;opacity:0;animation:zoom 1s cubic-bezier(.2,.9,.3,1.2) .2s forwards}
@keyframes zoom{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
h1{margin:40px 0 0;font:700 130px "Playfair Display";color:#041632}
.glow{position:relative;display:inline-block;border-radius:24%;overflow:hidden;line-height:0}
.glow::after{content:"";position:absolute;inset:-20%;background:linear-gradient(105deg,transparent 40%,rgba(255,236,190,.75) 50%,transparent 60%);transform:translateX(-120%);animation:sheen 1.1s ease-in-out 0.9s forwards}
@keyframes sheen{to{transform:translateX(120%)}}
.halo{animation:halo 2.2s ease-out 0.9s forwards}
@keyframes halo{0%{filter:drop-shadow(0 0 0 rgba(233,193,118,0))}35%{filter:drop-shadow(0 0 38px rgba(233,193,118,.85))}100%{filter:drop-shadow(0 0 14px rgba(233,193,118,.35))}}
</style></head><body><div class="center"><span class="halo"><span class="glow"><img class="logo" src="/static/img/flock-logo.svg"></span></span><h1 class="fade d2">Flock</h1>
<div class="ref fade d3">A ministry of Bible Baptist Church Barani</div></div></body></html>
