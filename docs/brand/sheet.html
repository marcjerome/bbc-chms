<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@500;600&display=swap" rel="stylesheet"><style>
body{margin:0;background:#efeeea;font-family:Inter;color:#121c2f}.row{display:flex;gap:28px;padding:28px 36px;align-items:center;border-bottom:1px solid #ddd}

<div class="row"><span class="tag">C</span><img class="big" src="flock-c.svg"><img class="sm" src="flock-c.svg"><img class="xs" src="flock-c.svg"><div class="word navy"><img src="flock-c.svg"><div><b>Flock</b><small>A ministry of BBC Barani</small></div></div></div>
</body></html>
