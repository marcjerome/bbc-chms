<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.ph{position:absolute;inset:0;background-size:cover;background-position:center}
#a{background-image:url(congregation.jpg);animation:za 9s linear forwards}
#b{background-image:url(pews.jpg);opacity:0;animation:zb 9s linear forwards}
@keyframes za{from{transform:scale(1.0)}to{transform:scale(1.12)}}
@keyframes zb{0%,45%{opacity:0;transform:scale(1.1)}55%{opacity:1}100%{opacity:1;transform:scale(1.0)}}
.lower{position:absolute;left:60px;bottom:60px;max-width:1100px;background:rgba(251,249,245,.95);border-left:6px solid #775a19;padding:20px 30px;border-radius:0 12px 12px 0;box-shadow:0 8px 30px rgba(4,22,50,.25)}
.lower p{margin:0;font:italic 400 40px/1.3 "Playfair Display",serif;color:#041632}.lower span{display:block;margin-top:8px;font:600 18px Inter;letter-spacing:.18em;text-transform:uppercase;color:#775a19}
</style></head><body><div class="ph" id="a"></div><div class="ph" id="b"></div>
<div class="lower fade d1"><p>“And the Lord added to the church daily such as should be saved.”</p><span>Acts 2:47</span></div></body></html>
