{% extends "base.html" %}
{% block content %}
<div class="card mx-auto max-w-lg p-8">
  <h1 class="text-2xl font-bold">Delete {{ service }}?</h1>
  <p class="mt-3 text-sm text-on-surface-variant">This removes the service and all {{ service.present_count }} check-ins recorded for it.</p>
  <form method="post" class="mt-6 flex justify-end gap-2">{% csrf_token %}
    <a href="{{ service.get_absolute_url }}" class="btn-ghost">Cancel</a>
    <button class="btn-danger">Delete</button>
  </form>
</div>
{% endblock %}
