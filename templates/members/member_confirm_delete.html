{% extends "base.html" %}
{% block content %}
<div class="card mx-auto max-w-lg p-8">
  <h1 class="text-2xl font-bold">Delete {{ member.full_name }}?</h1>
  <p class="mt-3 text-sm text-on-surface-variant">This permanently removes their record and attendance history. To keep their history, edit them and set the status to <strong>Inactive</strong> or <strong>Transferred</strong> instead.</p>
  <form method="post" class="mt-6 flex justify-end gap-2">{% csrf_token %}
    <a href="{{ member.get_absolute_url }}" class="btn-ghost">Cancel</a>
    <button class="btn-danger">Delete permanently</button>
  </form>
</div>
{% endblock %}
