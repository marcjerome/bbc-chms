{% if member.photo %}<img src="{{ member.photo.url }}" alt="" class="{{ size|default:'h-9 w-9' }} shrink-0 rounded-full object-cover">{% else %}<span class="{{ size|default:'h-9 w-9 text-xs' }} inline-flex shrink-0 items-center justify-center rounded-full bg-primary-fixed font-semibold text-primary">{{ member.initials }}</span>{% endif %}
