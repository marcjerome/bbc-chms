{% load chms %}
{% if page.has_other_pages %}
<nav class="flex items-center justify-between px-4 py-3 text-sm">
  <span class="text-on-surface-variant">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  <div class="flex gap-2">
    {% if page.has_previous %}<a class="btn-ghost" href="?{% query_with page=page.previous_page_number %}" {% if target %}hx-get="?{% query_with page=page.previous_page_number %}" hx-target="{{ target }}" hx-push-url="true"{% endif %}>Previous</a>{% endif %}
    {% if page.has_next %}<a class="btn-ghost" href="?{% query_with page=page.next_page_number %}" {% if target %}hx-get="?{% query_with page=page.next_page_number %}" hx-target="{{ target }}" hx-push-url="true"{% endif %}>Next</a>{% endif %}
  </div>
</nav>
{% endif %}
